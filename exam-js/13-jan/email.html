<body>
    <script>
        let email= prompt("");
        let pettern= /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if(pettern.test(email)){
            document.writeln("right")
        }
        else {
            document.writeln("not right")
        }
    </script>
