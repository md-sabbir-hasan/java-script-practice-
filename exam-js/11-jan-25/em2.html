<!-- ^\S+@\S+\.\S+$ -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let email = prompt("give your mail");
        let pattern = /.+@.+\..+/ ;

        if(pattern.test(email)){ 
            document.writeln("Correct")

        }
        else{
            document.writeln("INCorrect")
        }
    </script> 
</body>
</html>
