<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="">Name</label>
        <input type="text" id="name">
        <br>
        <label for="">contact</label>
        <input type="text" id="contact">
        <br>
        <label for="">Remarks</label>
        <textarea name="" id="remarks" rows="3" cols="20"></textarea>
        <br>

        <label for="">Sex</label>
        <input type="radio" name="gender" value="male">Male
        <input type="radio" name="gender" value="female">Fe-Male
        <input type="radio" name="gender" value="other">Other
        <br>

        <label for="">Courses</label>
        <input type="checkbox" id="nt" name="courses"  value="NT">NT
        <input type="checkbox" id="iad" name="courses" value="IAD">IAD
        <input type="checkbox" id="ddd" name="courses" value="DDD">DDD
        <input type="checkbox" id="esad" name="courses" value="ESAD">esad
        <br>

        <label for="">Location</label>
        <select name="" id="location">
            <option value="banani" id="banani">Banani</option>
            <option value="dhanmondi" id="dhanmondi">Dhanmondi</option>
            <option value="mirpur" id="mirpur">mirpur</option>
        </select>

        <br>
        <button type="submit" onclick="formsub()">Click</button>


    </form>

    <script src="form.js"></script>
</body>
</html>
