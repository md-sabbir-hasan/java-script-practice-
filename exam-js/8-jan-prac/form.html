<html lang="en">
<head>

</head>
<body>
    <form action="">
        <label for="">Name:</label>
        <input type="text" id="name">
        <br><br>

        <label for="">Contact:</label>
        <input type="text" id="contact">
        <br><br>

        <label for="">Remarks:</label>
        <textarea name="" id="remarks" rows="3" cols="20"></textarea>
        <br><br>

        <label for="">Location:</label>
        <select name="" id="location">
            <option value="mir">Mir</option>
            <option value="dhan">Dhan</option>
        </select>
        <br><br>

        <label for="">Sex:</label>
        <input type="radio" name="sex" id="male" value="male">Male
        <input type="radio" name="sex" id="female" value="female">Female
        <br><br>

        <label for="">Courses:</label>
        <input type="checkbox" name="courses" id="nt" value="nt">nt
        <input type="checkbox" name="courses" id="jee" value="jee">jee
        <input type="checkbox" name="courses" id="ddd" value="ddd">ddd
        <br><br>

        <button type="submit" onclick="formSub()">sub</button>
    </form>
    <script src="form.js"></script>

</html>
